<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencari Lokasi & Weather API</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        #map {
            height: 380px;
            width: 100%;
            border-radius: 1rem;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Section -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-map-location-dot text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-300">
                        GeoWeather Explorer
                    </h1>
                    <p class="text-xs text-gray-400">Pencarian Lokasi & Informasi Cuaca Real-time</p>
                </div>
            </div>

            <!-- Student Profile Badge -->
            <div class="glass-card px-4 py-2 rounded-xl flex items-center gap-3 border border-blue-500/20">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-500 flex items-center justify-center text-white font-bold text-sm shadow-md">
                    DA
                </div>
                <div>
                    <div class="text-xs font-semibold text-gray-200">Danish Arfa Syafaroz</div>
                    <div class="text-[11px] text-blue-400 font-mono">NIM: 20250140193</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 mt-8 space-y-6">

        <!-- Search Box Bar -->
        <div class="glass-card p-6 rounded-2xl">
            <form id="search-form" class="space-y-4" onsubmit="event.preventDefault(); handleSearch();">
                <label class="block text-sm font-medium text-gray-300">
                    <i class="fa-solid fa-magnifying-glass text-blue-400 mr-2"></i>Cari Lokasi
                </label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <input type="text" id="location-input" required
                            placeholder="Masukkan nama kota, kecamatan, atau daerah (contoh: Kasihan, Bantul)"
                            class="w-full bg-gray-800/80 text-white placeholder-gray-500 px-4 py-3 rounded-xl border border-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition duration-200">
                    </div>
                    <button type="submit" id="btn-search"
                        class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold px-6 py-3 rounded-xl shadow-lg shadow-blue-600/30 transition duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-search"></i>
                        <span>Cari Lokasi</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Dashboard Result Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Data Location Detail Cards (Left 1 Col) -->
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-blue-400"></i> Informasi Detail Lokasi
                </h2>

                <!-- Negara Card -->
                <div class="glass-card p-4 rounded-xl flex items-center justify-between border-l-4 border-l-blue-500">
                    <div>
                        <p class="text-xs text-gray-400 uppercase tracking-wider font-medium">Negara</p>
                        <p id="val-negara" class="text-base font-bold text-gray-100 mt-1">-</p>
                    </div>
                    <div class="bg-blue-500/10 p-3 rounded-xl text-blue-400">
                        <i class="fa-solid fa-earth-asia text-xl"></i>
                    </div>
                </div>

                <!-- Provinsi Card -->
                <div class="glass-card p-4 rounded-xl flex items-center justify-between border-l-4 border-l-indigo-500">
                    <div>
                        <p class="text-xs text-gray-400 uppercase tracking-wider font-medium">Provinsi</p>
                        <p id="val-provinsi" class="text-base font-bold text-gray-100 mt-1">-</p>
                    </div>
                    <div class="bg-indigo-500/10 p-3 rounded-xl text-indigo-400">
                        <i class="fa-solid fa-building-columns text-xl"></i>
                    </div>
                </div>

                <!-- Kecamatan Card -->
                <div class="glass-card p-4 rounded-xl flex items-center justify-between border-l-4 border-l-cyan-500">
                    <div>
                        <p class="text-xs text-gray-400 uppercase tracking-wider font-medium">Kecamatan / Daerah</p>
                        <p id="val-kecamatan" class="text-base font-bold text-gray-100 mt-1">-</p>
                    </div>
                    <div class="bg-cyan-500/10 p-3 rounded-xl text-cyan-400">
                        <i class="fa-solid fa-city text-xl"></i>
                    </div>
                </div>

                <!-- Coordinates Dual Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <!-- Longitude -->
                    <div class="glass-card p-4 rounded-xl border-l-4 border-l-emerald-500">
                        <p class="text-xs text-gray-400 uppercase tracking-wider font-medium">Longitude</p>
                        <p id="val-longitude" class="text-sm font-mono font-bold text-gray-100 mt-1">-</p>
                    </div>
                    <!-- Latitude -->
                    <div class="glass-card p-4 rounded-xl border-l-4 border-l-amber-500">
                        <p class="text-xs text-gray-400 uppercase tracking-wider font-medium">Latitude</p>
                        <p id="val-latitude" class="text-sm font-mono font-bold text-gray-100 mt-1">-</p>
                    </div>
                </div>

                <!-- Cuaca Card -->
                <div class="glass-card p-4 rounded-xl bg-gradient-to-br from-blue-900/40 to-indigo-900/40 border border-blue-500/30">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-xs text-blue-300 font-semibold uppercase tracking-wider">Cuaca Saat Ini</p>
                            <h3 id="val-temp" class="text-3xl font-extrabold text-white mt-1">-- °C</h3>
                            <p id="val-weather-desc" class="text-xs text-gray-300 mt-1 capitalize">-</p>
                        </div>
                        <div id="weather-icon-container" class="text-4xl text-amber-400">
                            <i class="fa-solid fa-cloud-sun"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Map View Container (Right 2 Cols) -->
            <div class="lg:col-span-2 space-y-4">
                <h2 class="text-lg font-semibold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-map text-blue-400"></i> Visualisasi Peta
                </h2>
                <div class="glass-card p-3 rounded-2xl">
                    <div id="map"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- Leaflet JS for Map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map;
        let marker;

        // Initialize map on page load
        window.addEventListener('DOMContentLoaded', () => {
            // Default center: Yogyakarta, Indonesia
            const defaultLat = -7.7956;
            const defaultLng = 110.3695;

            map = L.map('map').setView([defaultLat, defaultLng], 12);

            // OpenStreetMap Tile Layer (Gratis & Gambar Langsung Muncul)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            marker = L.marker([defaultLat, defaultLng]).addTo(map)
                .bindPopup("<b>Yogyakarta</b><br>Lokasi Default")
                .openPopup();
        });

        // Search Function
        async function handleSearch() {
            const query = document.getElementById('location-input').value.trim();
            if (!query) return;

            const btnSearch = document.getElementById('btn-search');
            btnSearch.disabled = true;
            btnSearch.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Mencari...</span>`;

            try {
                // 1. Fetch Geocoding Data (Nominatim OpenStreetMap)
                const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=1`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();

                if (!geoData || geoData.length === 0) {
                    alert('Lokasi tidak ditemukan! Cobalah menggunakan kata kunci lokasi yang lebih spesifik.');
                    return;
                }

                const result = geoData[0];
                const lat = parseFloat(result.lat);
                const lon = parseFloat(result.lon);
                const address = result.address || {};

                // Parsing Location Data
                const negara = address.country || '-';
                const provinsi = address.state || address.region || address.province || '-';
                const kecamatan = address.subdistrict || address.district || address.city_district || address.town || address.suburb || address.village || address.city || '-';

                // Update UI Display
                document.getElementById('val-negara').innerText = negara;
                document.getElementById('val-provinsi').innerText = provinsi;
                document.getElementById('val-kecamatan').innerText = kecamatan;
                document.getElementById('val-longitude').innerText = lon.toFixed(6);
                document.getElementById('val-latitude').innerText = lat.toFixed(6);

                // Update Map View
                map.flyTo([lat, lon], 13, { duration: 1.5 });
                marker.setLatLng([lat, lon])
                    .bindPopup(`<b>${result.display_name.split(',')[0]}</b><br>${kecamatan}, ${provinsi}`)
                    .openPopup();

                // 2. Fetch Weather Data (Open-Meteo API)
                fetchWeather(lat, lon);

            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan saat mengambil data.');
            } finally {
                btnSearch.disabled = false;
                btnSearch.innerHTML = `<i class="fa-solid fa-search"></i> <span>Cari Lokasi</span>`;
            }
        }

        // Fetch Weather Data Function
        async function fetchWeather(lat, lon) {
            try {
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
                const res = await fetch(weatherUrl);
                const data = await res.json();

                if (data.current_weather) {
                    const temp = data.current_weather.temperature;
                    const code = data.current_weather.weathercode;

                    document.getElementById('val-temp').innerText = `${temp} °C`;
                    document.getElementById('val-weather-desc').innerText = getWeatherDescription(code);
                    document.getElementById('weather-icon-container').innerHTML = getWeatherIcon(code);
                }
            } catch (e) {
                console.error("Gagal mengambil data cuaca", e);
            }
        }

        function getWeatherDescription(code) {
            if (code === 0) return 'Cerah / Clear Sky';
            if ([1, 2, 3].includes(code)) return 'Berawan Sebagian';
            if ([45, 48].includes(code)) return 'Berkabut';
            if ([51, 53, 55, 61, 63, 65].includes(code)) return 'Hujan Gerimis / Sedang';
            if ([80, 81, 82].includes(code)) return 'Hujan Deras';
            if ([95, 96, 99].includes(code)) return 'Badai / Petir';
            return 'Cuaca Normal';
        }

        function getWeatherIcon(code) {
            if (code === 0) return `<i class="fa-solid fa-sun text-amber-400"></i>`;
            if ([1, 2, 3].includes(code)) return `<i class="fa-solid fa-cloud-sun text-yellow-300"></i>`;
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return `<i class="fa-solid fa-cloud-showers-heavy text-blue-400"></i>`;
            if ([95, 96, 99].includes(code)) return `<i class="fa-solid fa-bolt text-yellow-400"></i>`;
            return `<i class="fa-solid fa-cloud text-gray-300"></i>`;
        }
    </script>
</body>
</html>
